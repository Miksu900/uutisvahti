name: Kerää ja julkaise
# Kerää uutiset 10 minuutin välein ja julkaisee sivuston suoraan GitHub Pagesiin.
# Kerätty data EI tallennu repoon (repo ei paisu). Edellinen tila haetaan julkaistulta sivulta.
on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  julkaise:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Palauta edellinen tila (GitHubin välimuisti)
        uses: actions/cache/restore@v4
        with:
          path: .tila
          key: tila-${{ github.run_id }}
          restore-keys: tila-
      - name: Ota tila käyttöön
        env:
          OMA_URL: ${{ vars.UUTISVAHTI_URL || 'https://nytpuhutaan.fi/vahti' }}
          KOOSTE_URL: ${{ vars.KOOSTE_BASE_URL || 'https://nytpuhutaan.fi' }}
        run: |
          # 1) välimuisti (aina edellisen ajon tulos), 2) julkaistu sivu, 3) repon kopio
          ota() {
            if [ -s ".tila/$1" ] && python3 -c "import json; json.load(open('.tila/$1'))"; then
              cp ".tila/$1" "$3"; echo "tila välimuistista: $1"
            elif curl -fsSL --retry 3 "$2?t=$(date +%s)" -o /tmp/tila.json && python3 -c "import json; json.load(open('/tmp/tila.json'))"; then
              mv /tmp/tila.json "$3"; echo "tila sivulta: $2"
            else
              echo "tilaa ei saatu, käytetään repon kopiota: $3"
            fi
          }
          ota oma.json "$OMA_URL/data.json" data.json
          ota kooste.json "$KOOSTE_URL/data.json" kooste/data.json
          ota muutokset.json "$KOOSTE_URL/muutokset.json" kooste/muutokset.json
      - name: Oma uutisvahti
        run: |
          if [ $(( 10#$(date -u +%M) )) -lt 10 ]; then export OMA_GOOGLE=1; else export OMA_GOOGLE=0; fi
          python3 keraa.py
      - name: Laaja kooste
        run: |
          # Googlen aihehaut jaetaan kuuteen osaan: tämä ajo tekee osan (minuutti / 10), median omat virrat joka kerta
          export KOOSTE_GOOGLE_OSA=$(( 10#$(date -u +%M) / 10 ))
          python3 kooste/keraa.py
        env:
          BASE_URL: ${{ vars.KOOSTE_BASE_URL || 'https://nytpuhutaan.fi' }}
          SITE_NAME: ${{ vars.KOOSTE_NIMI || 'Nytpuhutaan.fi' }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          KOOSTE_YLLAPITAJA: ${{ vars.KOOSTE_YLLAPITAJA }}
          KOOSTE_YHTEYS: ${{ vars.KOOSTE_YHTEYS }}
      - name: Tallenna tila seuraavaa ajoa varten
        run: |
          mkdir -p .tila && cp data.json .tila/oma.json && cp kooste/data.json .tila/kooste.json && (cp kooste/muutokset.json .tila/muutokset.json || true)
      - uses: actions/cache/save@v4
        with:
          path: .tila
          key: tila-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Kokoa julkaistava sivusto
        run: |
          # nytpuhutaan.fi: laaja kooste juureen, oma uutisvahti alipolkuun /vahti/
          rm -rf _site && mkdir -p _site/vahti
          cp -r kooste/. _site/
          cp index.html data.json _site/vahti/
          cp kooste/404.html _site/404.html 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
