name: Kerää laaja kooste
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kooste
  cancel-in-progress: false
jobs:
  kooste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 kooste/keraa.py
        env:
          BASE_URL: ${{ vars.KOOSTE_BASE_URL || 'https://miksu900.github.io/uutisvahti/kooste' }}
          SITE_NAME: ${{ vars.KOOSTE_NIMI || 'Uutiskooste' }}
      - name: Tallenna
        run: |
          git config user.name "uutiskooste"
          git config user.email "uutiskooste@users.noreply.github.com"
          git add kooste
          git diff --cached --quiet && exit 0
          git commit -m "Kooste $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((i*5))
          done
          exit 1
