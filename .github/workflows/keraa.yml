name: Kerää uutiset
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: keraa
  cancel-in-progress: false
jobs:
  keraa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 keraa.py
      - name: Tallenna
        run: |
          git config user.name "uutisvahti"
          git config user.email "uutisvahti@users.noreply.github.com"
          git add data.json index.html
          git diff --cached --quiet && exit 0
          git commit -m "Päivitys $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
